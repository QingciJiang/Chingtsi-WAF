# --- 2001 union [all] select ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\bunion\b[\s/**/]+\b(?:all\b[\s/**/]+)?\bselect\b)" "id:2001,score:5,msg:'SQL 注入：union select',action:block"

# --- 2002 select ... from ... ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\bselect\b[\s/**/]{1,20}[\w\x2e\x2a\x60\x27\x22\[\]]{1,80}[\s/**/]+\bfrom\b)" "id:2002,score:4,msg:'SQL 注入：select from 结构',action:block"

# --- 2003 布尔恒真 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\x27\s*\bor\b\s*\x27?\w+\x27?\s*=\s*\x27?\w+|\x22\s*\bor\b\s*\x22?\w+\x22?\s*=\s*\x22?\w+)" "id:2003,score:5,msg:'SQL 注入：布尔恒真',action:block"

# --- 2004 注释截断 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:;[\s/**/]*-{2,}|[\s/**/]+(?:union|select|or|and)[\s/**/]+[^\r\n]{0,40}-{2,}[\s]*(?:$|[\r\n]))" "id:2004,score:4,msg:'SQL 注入：注释截断',action:block"

# --- 2005 时间盲注 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\b(?:sleep|pg_sleep|benchmark)\s*\(\s*\d+|waitfor\s+delay\s+\x27)" "id:2005,score:5,msg:'SQL 注入：时间盲注函数',action:block"

# --- 2006 元数据探测 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:information_schema|sysobjects|syscolumns|@@version|@@datadir|\bxp_cmdshell\b)" "id:2006,score:5,msg:'SQL 注入：数据库元数据探测',action:block"

# --- 2007 文件读写 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\bload_file\s*\(|\binto\s+(?:out|dump)file\b|\binto\s+@)" "id:2007,score:5,msg:'SQL 注入：文件读写',action:block"

# --- 2008 堆叠查询 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:;\s*(?:insert|update|delete|drop|create|alter|truncate|exec|declare)\b)" "id:2008,score:5,msg:'SQL 注入：堆叠查询',action:block"

# --- 2009 编码绕过：char() / chr() 拼接 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\bchar\s*\(\s*\d{1,3}\s*(?:,\s*\d{1,3}\s*){2,}\)|\bconcat\s*\(\s*\bchar\b)" "id:2009,score:5,msg:'SQL 注入：字符函数拼接',action:block"

# --- 2010 常见注入 payload 片段 ---
SecRule ARGS|REQUEST_BODY "@pm 1=1 or 1=1 or%201=1 union%20select exec( sp_executesql" "id:2010,score:4,msg:'SQL 注入：常见 payload 片段',action:block"
