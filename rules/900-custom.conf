# ============================================================
#  Chingtsi WAF 自定义规则
#  Copyright (c) 2026 Chingtsi Studio. All rights reserved.
#
#  在这里追加你自己的规则，文件按名称顺序加载，编号请从 9000 起，
#  避免与内置规则冲突。
#
#  语法：
#    SecRule <变量> "<操作符> <参数>" "id:<编号>,score:<分值>,msg:'<说明>',action:block"
#
#  变量：REQUEST_URI / REQUEST_PATH / QUERY_STRING / REQUEST_BODY / ARGS
#        ARGS_NAMES / REQUEST_HEADERS / REQUEST_HEADERS:<名称> / REQUEST_COOKIES
#        REMOTE_ADDR / REQUEST_METHOD / REQUEST_LINE
#  操作符：@rx 正则 / @pm 空格分隔关键词 / @contains / @streq / @beginswith / @endsWith
#  动作：action:block（计分并在达阈值时拦截）/ action:pass（不计分）/ action:log（只记录）
#
#  说明：参数中如需单引号请写 \x27，双引号请写 \x22，避免与规则引号冲突。
# ============================================================

# 示例 1：拦截对后台登录页的非常规来源访问
# SecRule REQUEST_URI "@rx ^/admin/" "id:9001,score:2,msg:'后台路径访问',action:log"

# 示例 2：屏蔽特定 UA
# SecRule REQUEST_HEADERS:User-Agent "@pm my-bad-bot" "id:9002,score:5,msg:'自定义 UA 黑名单',action:block"

# 示例 3：禁止访问某个目录
# SecRule REQUEST_URI "@beginsWith /private/" "id:9003,score:5,msg:'目录禁止访问',action:block"
