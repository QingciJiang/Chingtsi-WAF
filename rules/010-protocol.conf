#
#  语法参考 ModSecurity SecRule：
#    SecRule 变量 "操作符 参数" "id:编号,score:分值,msg:'说明',action:block"
#  变量可用 | 组合；单双引号在参数内请用 \x27 / \x22 表示。
# ============================================================

# --- 1001 空 User-Agent：脚本化请求的强特征 ---
SecRule REQUEST_HEADERS:User-Agent "@rx ^$" "id:1001,score:5,msg:'空 User-Agent',action:block"

# --- 1002 可疑 User-Agent 关键字 ---
SecRule REQUEST_HEADERS:User-Agent "@pm sqlmap nikto masscan nmap zgrab nuclei w3af acunetix appscan netsparker dirbuster gobuster wfuzz xray" "id:1002,score:5,msg:'已知攻击工具 User-Agent',action:block"

# --- 1003 方法伪装 ---
SecRule REQUEST_HEADERS:X-HTTP-Method-Override "@rx ." "id:1003,score:3,msg:'方法覆写头',action:block"

# --- 1004 Host 头注入 ---
SecRule REQUEST_HEADERS:Host "@rx [\x00-\x20<>\x22\x27]" "id:1004,score:5,msg:'Host 头含非法字符',action:block"

# --- 1005 双重编码探测 ---
SecRule REQUEST_URI "@rx %25(?:27|22|3c|3e|2e|2f|5c)" "id:1005,score:3,msg:'疑似双重 URL 编码绕过',action:block"

# --- 1006 Log4j / JNDI 注入 ---
SecRule ARGS|REQUEST_HEADERS "@rx \$\{jndi:" "id:1006,score:5,msg:'JNDI 注入（Log4Shell 类）',action:block"

# --- 1007 Null 字节截断 ---
SecRule ARGS|REQUEST_URI "@rx %00|\x00" "id:1007,score:5,msg:'Null 字节截断',action:block"

# --- 1008 超长参数（缓冲溢出/混淆） ---
SecRule ARGS "@rx .{4096,}" "id:1008,score:3,msg:'超长参数值',action:block"
