# --- 3001 script 标签 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx <\s*script\b" "id:3001,score:5,msg:'XSS：script 标签',action:block"

# --- 3002 javascript 伪协议 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\bjavascript\s*:|\bvbscript\s*:|\bdata\s*:\s*text/html)" "id:3002,score:5,msg:'XSS：危险伪协议',action:block"

# --- 3003 事件属性注入 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx \bon(?:error|load|mouseover|click|focus|blur|submit|change|input|animationstart|toggle)\s*=" "id:3003,score:5,msg:'XSS：内联事件属性',action:block"

# --- 3004 危险标签 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx <\s*(?:iframe|frame|object|embed|applet|meta|link|style|base)\b" "id:3004,score:4,msg:'XSS：危险 HTML 标签',action:block"

# --- 3005 svg / img 载荷 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx <\s*(?:svg|img|body|video|audio|details|marquee)\b[^>]{0,200}\bon\w+\s*=" "id:3005,score:5,msg:'XSS：SVG/媒体标签载荷',action:block"

# --- 3006 DOM 敏感 API ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\bdocument\s*\.\s*(?:cookie|domain|write|location)\b|\bwindow\s*\.\s*location\b|\beval\s*\(|\balert\s*\(|\bprompt\s*\(|\bconfirm\s*\()" "id:3006,score:4,msg:'XSS：DOM 敏感调用',action:block"

# --- 3007 编码变形 ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\bString\s*\.\s*fromCharCode\b|\batob\s*\(|\bunescape\s*\(|&#x?[0-9a-f]{2,4};)" "id:3007,score:3,msg:'XSS：字符编码构造',action:block'

# --- 3008 CSS expression ---
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\bexpression\s*\(|\bbehavior\s*:|-moz-binding)" "id:3008,score:4,msg:'XSS：CSS 表达式',action:block"
