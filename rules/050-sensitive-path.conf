# --- 5001 版本控制目录 ---
SecRule REQUEST_URI "@rx /(?:\.git|\.svn|\.hg|\.bzr)(?:/|$|\?)" "id:5001,score:5,msg:'敏感路径：版本控制目录',action:block"

# --- 5002 环境与密钥文件 ---
SecRule REQUEST_URI "@rx /(?:\.env(?:\.[\w-]+)?|\.aws/credentials|\.ssh/id_rsa|\.htpasswd|\.npmrc|\.dockercfg)(?:$|\?|/)" "id:5002,score:5,msg:'敏感路径：密钥与配置',action:block"

# --- 5003 数据库与备份文件 ---
SecRule REQUEST_URI "@rx [\x2f\x5c](?:[\w.\-]{1,60}\.(?:sql|bak|backup|old|orig|swp|dump|tar\.gz|tgz|7z|rar)|(?:backup|www|web|site|db|data|htdocs)[\w.\-]{0,20}\.zip)(?:$|\?)" "id:5003,score:4,msg:'敏感路径：备份与数据库导出',action:block"

# --- 5004 配置与编辑器临时文件 ---
SecRule REQUEST_URI "@rx /(?:web\.config|app\.config|composer\.(?:json|lock)|package\.json|\.DS_Store|\.htaccess|[\w.\-]+\.(?:php|asp|aspx|jsp|config)~)$" "id:5004,score:4,msg:'敏感路径：配置文件与临时副本',action:block"

# --- 5005 数据库管理面板 ---
SecRule REQUEST_URI "@rx /(?:phpmyadmin|pma|myadmin|adminer|adminer\.php|dbadmin|mysqladmin)(?:/|$|\?|\.php)" "id:5005,score:4,msg:'敏感路径：数据库管理面板',action:block"

# --- 5006 服务器状态与诊断页 ---
SecRule REQUEST_URI "@rx /(?:server-status|server-info|phpinfo\.php|info\.php|test\.php|\.well-known/security\.txt)$" "id:5006,score:3,msg:'敏感路径：服务器状态页',action:block"

# --- 5007 常见后门路径 ---
SecRule REQUEST_URI "@rx /(?:shell|cmd|backdoor|webshell|upload|upfile|xp|hack)\.(?:php|jsp|asp|aspx)$" "id:5007,score:5,msg:'敏感路径：疑似后门文件',action:block"

# --- 5008 路径遍历特征字符（低分，仅计分） ---
SecRule REQUEST_URI "@rx (?:%2e%2e|\.\.%2f|%252e%252e)" "id:5008,score:2,msg:'请求路径含遍历编码',action:block"

# --- 5009 IIS 短文件名探测 ---
SecRule REQUEST_URI "@rx /[\w~]{1,6}~[0-9]\.[a-z]{2,4}(?:$|\?)" "id:5009,score:4,msg:'IIS 短文件名枚举',action:block"

# --- 5010 TRACE 类探测头 ---
SecRule REQUEST_HEADERS:X-Forwarded-Host "@rx [\x00-\x20]" "id:5010,score:3,msg:'转发头注入',action:block"
