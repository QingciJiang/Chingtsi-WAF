# --- 4001 目录穿越 ---
SecRule ARGS|REQUEST_URI "@rx (?:\.\.[\x2f\x5c]|\.\.%2f|%2e%2e%2f|\.\.%5c)" "id:4001,score:5,msg:'路径穿越：../../',action:block"

# --- 4002 系统敏感文件读取 ---
SecRule ARGS|REQUEST_URI "@rx (?:/etc/(?:passwd|shadow|group|hosts)|\bwin\.ini\b|\bboot\.ini\b|/proc/self/environ|/proc/self/cmdline)" "id:4002,score:5,msg:'路径穿越：读取系统文件',action:block"

# --- 4003 PHP 封装协议 ---
SecRule ARGS|REQUEST_URI "@rx (?:php\s*:\s*//(?:input|filter|data|expect)|data\s*:\s*text/plain\s*;base64|zip\s*:\s*//)" "id:4003,score:5,msg:'文件包含：PHP 封装协议',action:block"

# --- 4004 命令分隔注入 ---
SecRule ARGS|REQUEST_BODY "@rx (?:[;\x7c&]\s*(?:cat|ls|id|whoami|uname|wget|curl|nc|bash|sh|cmd|powershell|net\s+user|ipconfig|tasklist)\b)" "id:4004,score:5,msg:'命令注入：管道与分隔符',action:block"

# --- 4005 命令替换 ---
SecRule ARGS|REQUEST_BODY "@rx (?:\$\([^)\r\n]{1,120}\)|\x60[^\x60\r\n]{1,120}\x60)" "id:4005,score:5,msg:'命令注入：命令替换',action:block"

# --- 4006 危险函数调用 ---
SecRule ARGS|REQUEST_BODY "@rx (?:\b(?:system|exec|passthru|shell_exec|popen|proc_open|pcntl_exec)\s*\(|Runtime\s*\.\s*getRuntime\s*\(\s*\)\s*\.\s*exec)" "id:4006,score:5,msg:'命令执行：危险函数',action:block"

# --- 4007 Windows 命令解释器 ---
SecRule ARGS|REQUEST_BODY "@rx (?:\bcmd(?:\.exe)?\s*/c\b|\bpowershell(?:\.exe)?\s+(?:-\w+\s+)*-c|\bwscript\.exe\b|\bcscript\.exe\b)" "id:4007,score:5,msg:'命令执行：Windows 解释器',action:block"

# --- 4008 反序列化载荷 ---
SecRule ARGS|REQUEST_BODY|REQUEST_COOKIES "@rx (?:\brO0AB|\bO:\d{1,3}:\x22|ACED0005|\bjava\.lang\.Runtime\b|\b__reduce__\b|\bPyYAML\b)" "id:4008,score:5,msg:'反序列化攻击载荷',action:block"

# --- 4009 SSRF 内网探测 ---
SecRule ARGS "@rx (?:(?:\bhttps?|ftp)\s*:\s*//(?:127\.0\.0\.1|localhost|0\.0\.0\.0|169\.254\.169\.254|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}))" "id:4009,score:4,msg:'SSRF：内网地址探测',action:block"
