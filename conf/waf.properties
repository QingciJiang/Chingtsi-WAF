# ---------- 监听 ----------
# 监听地址，0.0.0.0 表示所有网卡
listen.host = 0.0.0.0
# 监听端口。自动模式下，端口号最小的 IIS 站点会沿用本端口（保持 Cloudflare 隧道指向不变）
listen.port = 8091
# 工作线程数
worker.threads = 128

# ---------- 上游（被保护的站点） ----------
# 反向代理目标，即原 IIS 站点地址（自动模式下按 IIS 站点端口逐个指定上游，本项仅作兜底）
upstream.base = http://127.0.0.1:80
# 上游超时（毫秒）
upstream.timeout.ms = 30000

# ---------- IIS 自动防护 ----------
# true：自动读取 IIS 配置，为每个 IIS 网站的 HTTP 端口建立前置监听并防护
iis.auto = true
# IIS 配置文件路径，留空自动探测 %windir%\System32\inetsrv\config\applicationHost.config
iis.config.file =
# 站点端口→前置端口 显式映射，例如 80:8091,8080:16080；留空自动规划
iis.front.map =
# IIS 配置刷新间隔（秒，最小 5），新增/删除站点后自动增减监听
iis.refresh.seconds = 20

# ---------- 响应标识 ----------
# 对外显示的 Server 头，用于隐藏真实 IIS/PHP 版本
server.name = Chingtsi-WAF

# ---------- 请求限制 ----------
# 单请求体上限（字节），默认 10 MB
max.body.bytes = 10485760
# 允许的 HTTP 方法，逗号分隔
allow.methods = GET,POST,HEAD,OPTIONS,PUT,DELETE,PATCH

# ---------- 规则与评分 ----------
# 规则目录（相对项目根目录）
rule.dir = rules
# 单条规则未声明 score 时的默认分值
score.default = 5
# 入站异常分阈值，累计达到即拦截
threshold.inbound = 5
# 出站异常分阈值（保留项）
threshold.outbound = 4

# ---------- IP 名单 ----------
ip.whitelist = conf/ip-whitelist.txt
ip.blacklist = conf/ip-blacklist.txt

# ---------- 频率限制（CC 防护） ----------
# 统计窗口（秒）
rate.window.seconds = 60
# 单 IP 窗口内最大请求数
rate.limit = 600
# 超限后的封禁时长（秒）
rate.ban.seconds = 300

# ---------- 日志 ----------
log.file = logs/waf.log
# true 输出 JSON Lines，false 输出文本行
log.json = true
# 每写多少条强制刷盘：1=每条立即落盘（低流量站点推荐），大于 1 时另有 1 秒兜底刷盘线程
log.flush.every = 1

# ---------- 其它 ----------
# 是否信任 Cloudflare 的 CF-Connecting-IP 头（经 Cloudflare 隧道接入时必须为 true）
trust.cloudflare.ip = true
# 拦截页标题
block.page.title = Chingtsi WAF · 访问被拦截
